name: ci

on:
  push:
    branches: [main, stage-0-spec, "stage-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      # The keychain is not available on CI runners; tests use the encrypted-file backend.
      - if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      # Windows runners have no C toolchain by default, which -race needs; the race detector already ran on Linux/macOS.
      - if: runner.os == 'Windows'
        run: go test -count=1 ./...
      # timing gate (scanner speed); meaningless under -race, so it runs separately (and on shared Windows runners it is not stable enough to gate)
      - if: runner.os != 'Windows'
        run: go test -count=1 -run TestPerformance ./internal/scan

  windows-build:
    # Fast fail: the whole module cross-compiles and vets for Windows (the test job above runs the suite natively).
    name: build (windows, cross-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - run: GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/rigfile

  e2e:
    name: e2e (ubuntu + fedora containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu-latest is a native amd64 runner, so arch (pacman) is reliable here; e2e/run.sh's own default
      # excludes it because it is not reliable under QEMU emulation on an Apple Silicon dev machine.
      - run: e2e/run.sh ubuntu fedora alpine debian arch

  registry:
    # The registry against a real Postgres: store, API, auth, scan worker, pages, and the CLI end to end.
    name: registry (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RIGFILE_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -race ./internal/registry/... ./internal/regclient/... ./cmd/rigfile-registry/... ./cmd/rigfile/

  registry-e2e:
    name: registry e2e (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: e2e/registry.sh

  installer:
    # scripts/install.sh against a release signed by the REAL minisign tool: genuine installs, tampering is refused.
    name: installer (real minisign)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: e2e/install.sh

  dogfood:
    # Rigfile scans its own history with its own scanner (working agreement 9). New findings fail the build.
    name: dogfood (rigfile doctor --git on this repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/rigfile doctor --git . --max-commits 5000

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
