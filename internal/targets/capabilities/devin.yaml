  skills: {support: no, note: "not covered by the documentation read"}
  agents: {support: no, note: "not covered by the documentation read"}
  commands: {support: no, note: "not covered by the documentation read"}
  mcp_servers: {support: partial, note: "stdio only, ~/.config/devin/mcp_config.json under mcpServers; remote skipped (docs disagree on the field name: serverUrl vs url)"}
  hooks: {support: no, note: "not covered by the documentation read"}
  permissions: {support: no, note: "no documented permission rules"}
base_secure: instructions_only
