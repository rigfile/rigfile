{{define "rigs"}}{{if .Rigs}}<div class="rig-list">{{range .Rigs}}<div class="rig-row">
<div><h3><a href="/r/{{.Owner}}/{{.Name}}">{{.Owner}}/{{.Name}}</a> {{if .Latest}}<span class="tag">{{.Latest}}</span>{{end}}{{if eq .Visibility "private"}}<span class="tag">private</span>{{end}}</h3>
{{if .Description}}<div class="desc">{{.Description}}</div>{{end}}</div>
<div class="meta">★ {{.Stars}}</div></div>{{end}}</div>
{{else}}<div class="empty">{{.Empty}}</div>{{end}}{{end}}
